name: Release images
# Builds and publishes the Filterdesk container images to the GitHub Container
# Registry when a version tag (vYYYY.MM.N) is pushed, or by hand for an
# existing tag. Images: ghcr.io/<owner>/filterdesk-app, -web and -probe,
# tagged with the version (2026.12.1), the month (2026.12) and latest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v2026.12.1)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            context: .
            file: docker/Dockerfile
            target: runtime
            description: Filterdesk application (PHP-FPM; also runs the queue, scheduler and migrations)
          - image: web
            context: .
            file: docker/Dockerfile
            target: webserver
            description: Filterdesk web server (nginx in front of the application)
          - image: probe
            context: probe
            file: probe/Dockerfile
            target: ''
            description: Filterdesk website probe (Chromium; checks sites from a filtered network)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/filterdesk-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=filterdesk-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # A fresh base image, and the OS update layer rebuilt for every release (not served from cache).
          pull: true
          build-args: |
            OS_UPDATES_STAMP=${{ github.run_id }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
