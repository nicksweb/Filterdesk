version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /probe
    schedule: { interval: weekly }
  # Base images: the app and web images (docker/Dockerfile). The probe's
  # Playwright base image is bumped with the playwright package (CI checks
  # the two match), so it is not watched separately.
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
