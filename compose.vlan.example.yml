# Copy to compose.vlan.yml and replace these external network names with
# Docker macvlan/ipvlan networks that egress through the relevant VLAN.
# Also set STUDENT_PROBE_DNS_SERVERS / STAFF_PROBE_DNS_SERVERS in .env to each
# VLAN's gateway so lookups go uncached to the resolver UniFi filters on.
services:
  probe-student:
    networks:
      probe_control: {}
      student_vlan:
        gw_priority: 1
  probe-staff:
    networks:
      probe_control: {}
      staff_vlan:
        gw_priority: 1

networks:
  student_vlan:
    external: true
    name: ${STUDENT_DOCKER_NETWORK}
  staff_vlan:
    external: true
    name: ${STAFF_DOCKER_NETWORK}
