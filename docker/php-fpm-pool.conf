; Filterdesk: how many requests the app serves at once. A website check holds
; a worker for its whole run (a few seconds), so the image default of 5 lets
; five people checking at once stall every page. Each worker uses about 40 MB.
; Set PHP_FPM_MAX_CHILDREN (and the others) in .env to change them.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = 500
