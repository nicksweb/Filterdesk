# Filterdesk. Pulls the published images (ghcr.io/nicksweb/filterdesk-*);
# set FILTERDESK_VERSION in .env to pin a release (for example 2026.12.1).
# To build from source instead, add compose.build.yml:
#   docker compose -f compose.yml -f compose.build.yml up -d --build
# Installs from before the rename keep their project name (and volumes) with
# COMPOSE_PROJECT_NAME=it-edu-selfservice in .env.
name: filterdesk

x-app: &app
  image: ${FILTERDESK_IMAGE_PREFIX:-ghcr.io/nicksweb/filterdesk}-app:${FILTERDESK_VERSION:-latest}
  env_file: .env
  environment:
    # Longer than the queue worker's --timeout, so a slow push is not started twice.
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-330}
  restart: unless-stopped
  networks: [app, outbound]
  volumes:
    - app_storage:/var/www/html/storage

x-probe: &probe
  image: ${FILTERDESK_IMAGE_PREFIX:-ghcr.io/nicksweb/filterdesk}-probe:${FILTERDESK_VERSION:-latest}
  env_file: .env
  restart: unless-stopped
  shm_size: 256mb
  networks: [probe_control, probe_egress]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
    interval: 20s
    timeout: 3s
    retries: 5

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [db_data:/var/lib/postgresql/data]
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["php", "artisan", "filterdesk:upgrade"]
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: *app
    networks:
      app:
        aliases: [filterdesk-php]
      outbound: {}
      probe_control: {}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      probe-student: { condition: service_healthy }
      probe-staff: { condition: service_healthy }

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=300", "--max-time=3600"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ${FILTERDESK_IMAGE_PREFIX:-ghcr.io/nicksweb/filterdesk}-web:${FILTERDESK_VERSION:-latest}
    ports: ["127.0.0.1:${APP_PORT:-8088}:8080"]
    networks: [app, frontend]
    restart: unless-stopped
    depends_on: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 20s
      timeout: 3s
      retries: 5

  probe-student:
    <<: *probe
    environment:
      PROBE_SHARED_KEY: ${PROBE_SHARED_KEY}
      PROBE_TIMEOUT_MS: ${PROBE_TIMEOUT_MS:-8000}
      PROBE_SETTLE_MS: ${PROBE_SETTLE_MS:-1500}
      BLOCK_PAGE_PATTERN: ${BLOCK_PAGE_PATTERN:-blocked|access denied|not permitted|content filter|unifi}
      ALLOWED_PRIVATE_HOSTS: ${STUDENT_ALLOWED_PRIVATE_HOSTS:-}
      PROBE_DNS_SERVERS: ${STUDENT_PROBE_DNS_SERVERS:-}
      BLOCK_PAGE_ADDRESSES: ${BLOCK_PAGE_ADDRESSES:-}
      PROBE_REUSE_BROWSER: ${PROBE_REUSE_BROWSER:-false}

  probe-staff:
    <<: *probe
    environment:
      PROBE_SHARED_KEY: ${PROBE_SHARED_KEY}
      PROBE_TIMEOUT_MS: ${PROBE_TIMEOUT_MS:-8000}
      PROBE_SETTLE_MS: ${PROBE_SETTLE_MS:-1500}
      BLOCK_PAGE_PATTERN: ${BLOCK_PAGE_PATTERN:-blocked|access denied|not permitted|content filter|unifi}
      ALLOWED_PRIVATE_HOSTS: ${STAFF_ALLOWED_PRIVATE_HOSTS:-}
      PROBE_DNS_SERVERS: ${STAFF_PROBE_DNS_SERVERS:-}
      BLOCK_PAGE_ADDRESSES: ${BLOCK_PAGE_ADDRESSES:-}
      PROBE_REUSE_BROWSER: ${PROBE_REUSE_BROWSER:-false}

networks:
  app: { internal: true }
  frontend: {}
  outbound: {}
  probe_control: { internal: true }
  probe_egress: {}

volumes:
  db_data: {}
  app_storage: {}
